<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Past Simple Challenge 1</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#e8f1ff,#f7f9fc);min-height:100vh;color:#172033}.game{max-width:900px;margin:auto;padding:28px 20px}.card{background:#fff;border-radius:24px;padding:38px;box-shadow:0 12px 35px rgba(0,0,0,.12);text-align:center}h1{font-size:42px;margin:8px 0 12px}h2{font-size:28px;margin:15px 0}.progress{font-weight:bold;color:#667085;margin-bottom:30px}.verb{font-size:54px;font-weight:800;margin:20px 0 35px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:18px}button{font-size:25px;font-weight:bold;padding:22px;border-radius:15px;border:2px solid #aab3c2;background:#f2f4f7;cursor:pointer}button:hover{background:#e7ebf2}.message{font-size:30px;font-weight:bold;margin:30px 0}.home{display:inline-block;margin-top:20px;padding:14px 24px;border-radius:12px;background:#172033;color:white;text-decoration:none}@media(max-width:650px){.answers{grid-template-columns:1fr}.verb{font-size:42px}h1{font-size:32px}.card{padding:24px}}</style></head><body><main class="game"><section class="card" id="app"></section></main><script>
const questions=[{"verb": "BE", "correct": "was/were", "options": ["beed", "was/were", "bed", "wereed"]}, {"verb": "GO", "correct": "went", "options": ["goed", "gowed", "wented", "went"]}, {"verb": "HAVE", "correct": "had", "options": ["haved", "haveed", "had", "hadded"]}, {"verb": "DO", "correct": "did", "options": ["did", "doed", "dided", "done"]}, {"verb": "MAKE", "correct": "made", "options": ["maked", "maded", "made", "makeed"]}, {"verb": "COME", "correct": "came", "options": ["came", "camed", "comed", "comen"]}, {"verb": "SEE", "correct": "saw", "options": ["seed", "sawed", "saw", "seeed"]}, {"verb": "GET", "correct": "got", "options": ["getted", "gat", "gotted", "got"]}, {"verb": "TAKE", "correct": "took", "options": ["tooked", "took", "taked", "toke"]}, {"verb": "GIVE", "correct": "gave", "options": ["gaive", "gaved", "gave", "gived"]}, {"verb": "FIND", "correct": "found", "options": ["fand", "found", "founded", "finded"]}, {"verb": "THINK", "correct": "thought", "options": ["thoughted", "thought", "thinked", "thaught"]}, {"verb": "KNOW", "correct": "knew", "options": ["knowed", "knowwed", "knew", "knewn"]}, {"verb": "SAY", "correct": "said", "options": ["saied", "said", "sayed", "sed"]}, {"verb": "TELL", "correct": "told", "options": ["teld", "telled", "talled", "told"]}, {"verb": "EAT", "correct": "ate", "options": ["aet", "eted", "eated", "ate"]}, {"verb": "DRINK", "correct": "drank", "options": ["drank", "drinked", "drunk", "dronk"]}, {"verb": "WRITE", "correct": "wrote", "options": ["wrote", "writed", "wroten", "writted"]}, {"verb": "READ", "correct": "read", "options": ["read", "readed", "red", "reed"]}, {"verb": "BUY", "correct": "bought", "options": ["baught", "boughted", "buyed", "bought"]}];let q=0;
function render(){let d=questions[q];document.getElementById('app').innerHTML=`<div class="progress">QUESTION ${q+1} / 20</div><h1>PAST SIMPLE CHALLENGE</h1><h2>Choose the past simple of:</h2><div class="verb">${d.verb}</div><div class="answers">${d.options.map((o,i)=>`<button onclick="answer(${i})">${o}</button>`).join('')}</div><div class="message" id="msg"></div>`;}
function answer(i){let d=questions[q];if(d.options[i]===d.correct){q++;if(q>=questions.length){document.getElementById('app').innerHTML='<h1>🎉 WELL DONE!</h1><div class="message">You completed all 20 questions.</div><a class="home" href="index.html">BACK TO HOME</a>';}else render();}else{document.getElementById('app').innerHTML='<h1>❌ NOT QUITE!</h1><div class="message">Try again from the beginning.</div><button onclick="q=0;render()">START AGAIN</button>';}}
render();
</script></body></html>
