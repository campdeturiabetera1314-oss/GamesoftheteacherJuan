<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Past Simple Challenge 3</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#e8f1ff,#f7f9fc);min-height:100vh;color:#172033}.game{max-width:900px;margin:auto;padding:28px 20px}.card{background:#fff;border-radius:24px;padding:38px;box-shadow:0 12px 35px rgba(0,0,0,.12);text-align:center}h1{font-size:42px;margin:8px 0 12px}h2{font-size:28px;margin:15px 0}.progress{font-weight:bold;color:#667085;margin-bottom:30px}.verb{font-size:54px;font-weight:800;margin:20px 0 35px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:18px}button{font-size:25px;font-weight:bold;padding:22px;border-radius:15px;border:2px solid #aab3c2;background:#f2f4f7;cursor:pointer}button:hover{background:#e7ebf2}.message{font-size:30px;font-weight:bold;margin:30px 0}.home{display:inline-block;margin-top:20px;padding:14px 24px;border-radius:12px;background:#172033;color:white;text-decoration:none}@media(max-width:650px){.answers{grid-template-columns:1fr}.verb{font-size:42px}h1{font-size:32px}.card{padding:24px}}</style></head><body><main class="game"><section class="card" id="app"></section></main><script>
const questions=[{"verb": "BEGIN", "correct": "began", "options": ["beginned", "began", "begun", "begined"]}, {"verb": "BREAK", "correct": "broke", "options": ["broke", "breaked", "broken", "broked"]}, {"verb": "CATCH", "correct": "caught", "options": ["caught", "caughted", "cotched", "catched"]}, {"verb": "DRAW", "correct": "drew", "options": ["drawed", "drew", "drewed", "drawn"]}, {"verb": "FLY", "correct": "flew", "options": ["flow", "flew", "flied", "flewed"]}, {"verb": "GROW", "correct": "grew", "options": ["grown", "grewed", "growed", "grew"]}, {"verb": "HOLD", "correct": "held", "options": ["helled", "holded", "hield", "held"]}, {"verb": "KEEP", "correct": "kept", "options": ["kept", "kepped", "keeped", "kipt"]}, {"verb": "LEARN", "correct": "learnt", "options": ["learnd", "learnt", "learned", "learnted"]}, {"verb": "LEND", "correct": "lent", "options": ["lent", "lended", "lented", "land"]}, {"verb": "LET", "correct": "let", "options": ["let", "letted", "leted", "leat"]}, {"verb": "LIE", "correct": "lay", "options": ["laied", "lay", "lieed", "lied"]}, {"verb": "RIDE", "correct": "rode", "options": ["ridden", "rided", "rode", "roed"]}, {"verb": "RING", "correct": "rang", "options": ["ringed", "rang", "rung", "rangd"]}, {"verb": "RISE", "correct": "rose", "options": ["rised", "rosed", "risen", "rose"]}, {"verb": "SING", "correct": "sang", "options": ["singed", "sanged", "sang", "sung"]}, {"verb": "SWIM", "correct": "swam", "options": ["swamed", "swimmed", "swam", "swum"]}, {"verb": "TEACH", "correct": "taught", "options": ["teached", "tought", "taught", "taughted"]}, {"verb": "THROW", "correct": "threw", "options": ["threwed", "throwed", "threw", "thrown"]}, {"verb": "UNDERSTAND", "correct": "understood", "options": ["understooded", "understood", "understanded", "understook"]}];let q=0;
function render(){let d=questions[q];document.getElementById('app').innerHTML=`<div class="progress">QUESTION ${q+1} / 20</div><h1>PAST SIMPLE CHALLENGE</h1><h2>Choose the past simple of:</h2><div class="verb">${d.verb}</div><div class="answers">${d.options.map((o,i)=>`<button onclick="answer(${i})">${o}</button>`).join('')}</div><div class="message" id="msg"></div>`;}
function answer(i){let d=questions[q];if(d.options[i]===d.correct){q++;if(q>=questions.length){document.getElementById('app').innerHTML='<h1>🎉 WELL DONE!</h1><div class="message">You completed all 20 questions.</div><a class="home" href="index.html">BACK TO HOME</a>';}else render();}else{document.getElementById('app').innerHTML='<h1>❌ NOT QUITE!</h1><div class="message">Try again from the beginning.</div><button onclick="q=0;render()">START AGAIN</button>';}}
render();
</script></body></html>
